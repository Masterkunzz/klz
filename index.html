<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aplikasi Kasir Kedai Lumpur Zein</title>
  <link rel="icon" href="assets/klz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body ready">
  <main class="login-card">
    <img src="assets/klz.jpg" alt="Logo KLZ" class="logo">
    <h1>APLIKASI KASIR<br>KEDAI LUMPUR ZEIN</h1>
    <p class="credit">develop by
      <a href="https://www.instagram.com/ahmadbafagihh_/" target="_blank" rel="noopener">Ahmad Bafagih</a>
    </p>

    <form id="loginForm" class="stack" autocomplete="on">
      <label>Username
        <input name="username" required autocapitalize="off" autocorrect="off" autocomplete="username">
      </label>
      <label>Password
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <p id="errorMsg" class="error" role="alert"></p>
      <button id="loginBtn" class="btn btn-primary btn-block btn-lg" type="submit">Masuk</button>
    </form>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
