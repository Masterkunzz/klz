<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin | Kedai Lumpur Zein</title>
  <link rel="icon" href="assets/klz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="assets/klz.jpg" alt="Logo KLZ">
        <div><strong>Panel Admin</strong><small>Kedai Lumpur Zein</small></div>
      </div>
      <button class="btn btn-ghost" id="logoutBtn">Keluar</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="produk">Produk</button>
      <button class="tab" data-tab="analitik">Analitik Penjualan</button>
    </nav>

    <main class="container">
      <!-- ============ TAB PRODUK ============ -->
      <section id="tab-produk" class="tab-panel">
        <div class="card">
          <h2 id="formTitle">Tambah Produk</h2>
          <form id="productForm" class="grid-form">
            <label>Nama Produk
              <input name="name" required maxlength="80">
            </label>
            <label>Seller
              <input name="seller" required maxlength="80">
            </label>
            <label>Harga (Rp)
              <input name="price" type="number" min="1" step="100" required inputmode="numeric">
            </label>
            <div class="form-actions">
              <button type="button" class="btn btn-ghost" id="cancelEdit" hidden>Batal</button>
              <button type="submit" class="btn btn-primary" id="saveProductBtn">Simpan Produk</button>
            </div>
          </form>
        </div>

        <div class="card">
          <div class="row-between">
            <h2>Daftar Produk</h2>
            <input id="productSearch" class="search-sm" placeholder="Cari produk / seller..." type="search">
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Nama Produk</th><th>Seller</th><th>Harga</th><th></th></tr>
              </thead>
              <tbody id="productRows"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ============ TAB ANALITIK ============ -->
      <section id="tab-analitik" class="tab-panel hidden">
        <div class="stats-grid">
          <div class="stat"><span>Omzet Hari Ini</span><strong id="sumHari">Rp 0</strong></div>
          <div class="stat"><span>Omzet Minggu Ini</span><strong id="sumMinggu">Rp 0</strong></div>
          <div class="stat"><span>Omzet Bulan Ini</span><strong id="sumBulan">Rp 0</strong></div>
        </div>

        <div class="card">
          <div class="seg" id="periodSeg">
            <button data-period="harian" class="active">Harian</button>
            <button data-period="mingguan">Mingguan</button>
            <button data-period="bulanan">Bulanan</button>
          </div>

          <div class="stats-grid small">
            <div class="stat"><span>Omzet Periode</span><strong id="pOmzet">-</strong></div>
            <div class="stat"><span>Transaksi</span><strong id="pTrx">-</strong></div>
            <div class="stat"><span>Item Terjual</span><strong id="pItems">-</strong></div>
            <div class="stat"><span>Cash / QRIS</span><strong id="pPay">-</strong></div>
          </div>

          <div class="chart-box"><canvas id="chart"></canvas></div>
        </div>

        <div class="two-col">
          <div class="card">
            <h2>Rincian Periode</h2>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Periode</th><th>Transaksi</th><th>Omzet</th></tr></thead>
                <tbody id="periodRows"></tbody>
              </table>
            </div>
          </div>
          <div class="card">
            <h2>Produk Terlaris (periode ini)</h2>
            <ol id="topList" class="top-list"></ol>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
