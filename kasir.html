<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kasir | Kedai Lumpur Zein</title>
  <link rel="icon" href="assets/klz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="assets/klz.jpg" alt="Logo KLZ">
        <div><strong>Kasir KLZ</strong><small>Kedai Lumpur Zein</small></div>
      </div>
      <button class="btn btn-ghost" id="logoutBtn">Keluar</button>
    </header>

    <main class="container">
      <!-- ===== HOME ===== -->
      <section id="viewHome">
        <div class="home-hero">
          <button class="btn btn-new" id="newOrderBtn"><span>+</span> New Order</button>
        </div>

        <div class="card">
          <div class="row-between">
            <h2>Riwayat Transaksi</h2>
            <input type="date" id="histDate" class="select-sm">
          </div>
          <div class="stats-grid small">
            <div class="stat"><span>Transaksi</span><strong id="dayCount">0</strong></div>
            <div class="stat"><span>Omzet</span><strong id="dayTotal">Rp 0</strong></div>
          </div>
          <ul id="histList" class="hist-list"></ul>
        </div>
      </section>

      <!-- ===== NEW ORDER ===== -->
      <section id="viewOrder" class="hidden">
        <div class="order-layout">
          <div class="card products-col">
            <div class="row-between">
              <button class="btn btn-ghost" id="backBtn">← Kembali</button>
              <input id="search" type="search" placeholder="Cari nama produk..." autocomplete="off">
            </div>

            <p class="section-label">Pilih seller</p>
            <div class="seller-strip" id="sellerStrip"></div>

            <p class="section-label">Kategori</p>
            <div class="chips" id="catChips"></div>

            <div id="productGrid" class="product-grid"></div>
          </div>

          <aside class="card cart-col">
            <h2>Pesanan Baru</h2>
            <ul id="cartList" class="cart-list"></ul>

            <div class="total-row"><span>Total</span><strong id="total">Rp 0</strong></div>

            <label>Nominal Bayar
              <input id="paid" type="number" inputmode="numeric" min="0" placeholder="0">
            </label>

            <div class="quick" id="quick">
              <button type="button" data-amt="10000">10rb</button>
              <button type="button" data-amt="20000">20rb</button>
              <button type="button" data-amt="50000">50rb</button>
              <button type="button" data-amt="100000">100rb</button>
              <button type="button" id="exactBtn">Uang pas</button>
            </div>

            <div id="paySeg" class="pay-seg">
              <button type="button" data-method="cash" class="active">Cash</button>
              <button type="button" data-method="qris">QRIS</button>
            </div>

            <div class="change-row"><span>Kembalian</span><strong id="change">Rp 0</strong></div>

            <button class="btn btn-primary btn-block btn-lg" id="saveBtn" disabled>Simpan Pesanan</button>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <!-- Popup sukses -->
  <div class="overlay" id="successOverlay">
    <div class="modal">
      <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="25" fill="none"/>
        <path fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
      </svg>
      <h2>Pesanan Berhasil!</h2>
      <p id="successInfo"></p>
      <button class="btn btn-primary btn-block btn-lg" id="closeSuccess">Tutup</button>
    </div>
  </div>

  <!-- Popup edit transaksi -->
  <div class="overlay" id="orderModal">
    <div class="modal form">
      <h2>Edit Transaksi</h2>
      <p class="muted" id="oeNo"></p>
      <ul id="oeItems" class="cart-list"></ul>

      <div class="pay-seg" id="oeMethod">
        <button type="button" data-m="cash">Cash</button>
        <button type="button" data-m="qris">QRIS</button>
      </div>

      <label>Nominal Bayar
        <input id="oePaid" type="number" inputmode="numeric" min="0">
      </label>

      <div class="total-row"><span>Total</span><strong id="oeTotal">Rp 0</strong></div>
      <div class="change-row"><span>Kembalian</span><strong id="oeChange">Rp 0</strong></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="orderModal">Batal</button>
        <button type="button" class="btn btn-primary" id="oeSave">Simpan Perubahan</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/kasir.js"></script>
</body>
</html>
